name = "SumOfFourSquares"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SumOfFourSquares"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "RogersRamanujan"
git = "https://github.com/seewoo5/RogersRamanujan"
rev = "jacobi-complex"

[[lean_lib]]
name = "SumOfFourSquares"
